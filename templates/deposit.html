{% extends "base.html" %}
{% block title %}Deposit — SecureBank{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Deposit Funds</h2>
</div>
<div class="card" style="max-width:480px;">
  <form method="post">
    <div class="form-group">
      <label for="account_id">Account</label>
      <select id="account_id" name="account_id" required>
        <option value="">Select account...</option>
        {% for acc in accounts %}
        <option value="{{ acc.id }}" {% if request.args.get('account_id')|int == acc.id %}selected{% endif %}>
          {{ acc.account_number }}{% if acc.full_name is defined %} — {{ acc.full_name }}{% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="amount">Amount ($)</label>
      <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
    </div>
    <div class="form-group">
      <label for="description">Description (optional)</label>
      <input type="text" id="description" name="description" placeholder="Deposit">
    </div>
    <button type="submit" class="btn btn-success">Submit Deposit</button>
  </form>
</div>
{% endblock %}
