{% extends "auth_base.html" %}
{% block title %}Register — SecureBank{% endblock %}
{% block content %}
<h1>Create Account</h1>
<p class="subtitle">Register as a new customer</p>
<form method="post" action="{{ url_for('register') }}">
  <div class="form-group">
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name" required>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required minlength="3">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
  </div>
  <div class="form-group">
    <label for="phone">Phone (optional)</label>
    <input type="tel" id="phone" name="phone">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required>
    </div>
  </div>
  <hr style="margin:1rem 0;border:none;border-top:1px solid var(--border);">
  <p style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem;">Your first bank account</p>
  <div class="form-row">
    <div class="form-group">
      <label for="account_type">Account Type</label>
      <select id="account_type" name="account_type">
        <option value="savings">Savings</option>
        <option value="checking">Checking</option>
      </select>
    </div>
    <div class="form-group">
      <label for="initial_deposit">Initial Deposit ($)</label>
      <input type="number" id="initial_deposit" name="initial_deposit" min="0" step="0.01" value="0">
    </div>
  </div>
  <button type="submit" class="btn btn-success btn-block">Register</button>
</form>
<p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
