{% extends "auth_base.html" %}
{% block title %}Login — SecureBank{% endblock %}
{% block content %}
<h1>Welcome Back</h1>
<p class="subtitle">Sign in to your banking account</p>
<form method="post" action="{{ url_for('login') }}">
  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Sign In</button>
</form>
<p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
<p class="auth-footer" style="margin-top:0.5rem;font-size:0.8rem;">Demo admin: <strong>admin</strong> / <strong>admin123</strong></p>
{% endblock %}
