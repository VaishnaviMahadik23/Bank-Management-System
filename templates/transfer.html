{% extends "base.html" %}
{% block title %}Transfer — SecureBank{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Fund Transfer</h2>
  <p>Transfer money between accounts</p>
</div>
<div class="card" style="max-width:480px;">
  <form method="post">
    <div class="form-group">
      <label for="from_account_id">From Account</label>
      <select id="from_account_id" name="from_account_id" required>
        <option value="">Select source account...</option>
        {% for acc in accounts %}
        <option value="{{ acc.id }}">
          {{ acc.account_number }} — Balance: ${{ "%.2f"|format(acc.balance) }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="to_account_number">To Account Number</label>
      <input type="text" id="to_account_number" name="to_account_number" required
             pattern="[0-9]{10}" title="10-digit account number" placeholder="1234567890">
    </div>
    <div class="form-group">
      <label for="amount">Amount ($)</label>
      <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
    </div>
    <div class="form-group">
      <label for="description">Description (optional)</label>
      <input type="text" id="description" name="description" placeholder="Fund transfer">
    </div>
    <button type="submit" class="btn btn-primary">Transfer</button>
  </form>
</div>
{% endblock %}
