{% extends "base.html" %}
{% block title %}Profile — SecureBank{% endblock %}
{% block content %}
<div class="page-header">
  <h2>My Profile</h2>
</div>
<div class="card" style="max-width:480px;">
  <form method="post">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" value="{{ g.user.full_name }}" required>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" value="{{ g.user.username }}" disabled>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" value="{{ g.user.email }}" disabled>
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" value="{{ g.user.phone or '' }}">
    </div>
    <hr style="margin:1.25rem 0;border:none;border-top:1px solid var(--border);">
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem;">Leave blank to keep current password</p>
    <div class="form-row">
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" minlength="6">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password">
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
